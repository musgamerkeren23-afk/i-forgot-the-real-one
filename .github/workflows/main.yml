name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip (kalau project masih berupa .zip)
        run: |
          for z in $(find . -name "*.zip" -not -path "./.git/*"); do
            unzip -oq "$z" -d "$(dirname "$z")"
          done
      - name: Cari folder project
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then echo "settings.gradle.kts tidak ketemu di repo!"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: H4ll0-Reward-Games-APK
          path: "**/build/outputs/apk/debug/*.apk"
